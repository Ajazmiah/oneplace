<svg width="520" height="160" viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg">
  <title>OnePlace Logo</title>
  <desc>OnePlace full wordmark logo with icon</desc>
  <defs>
    <style>
      .logo-text { fill: #2C2C2A; }
      .logo-sub  { fill: #1D9E75; }
      .d1 { fill: #1D9E75; }
      .d2 { fill: #0F6E56; }
      .d3 { fill: #5DCAA5; }
      .d4 { fill: #085041; }
      .d5 { fill: #9FE1CB; }
      @media (prefers-color-scheme: dark) {
        .logo-text { fill: #F1EFE8; }
        .logo-sub  { fill: #9FE1CB; }
        .d1 { fill: #1D9E75; }
        .d2 { fill: #5DCAA5; }
        .d3 { fill: #0F6E56; }
        .d4 { fill: #9FE1CB; }
        .d5 { fill: #085041; }
      }
    </style>
  </defs>
  <!-- Icon -->
  <circle class="d1" cx="80"  cy="80"  r="19"/>
  <circle class="d2" cx="80"  cy="41"  r="12"/>
  <circle class="d3" cx="114" cy="60"  r="12"/>
  <circle class="d3" cx="114" cy="100" r="12"/>
  <circle class="d4" cx="80"  cy="119" r="12"/>
  <circle class="d5" cx="46"  cy="100" r="12"/>
  <circle class="d2" cx="46"  cy="60"  r="12"/>
  <!-- Wordmark -->
  <text x="144" y="98"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="90" font-weight="500" letter-spacing="1"
    class="logo-text">one<tspan class="logo-sub">place</tspan></text>
</svg>
