<svg width="260" height="80" viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg">
  <title>OnePlace Logo Compact</title>
  <defs>
    <style>
      .logo-text { fill: #2C2C2A; }
      .logo-sub  { fill: #1D9E75; }
      .d1 { fill: #1D9E75; }
      .d2 { fill: #0F6E56; }
      .d3 { fill: #5DCAA5; }
      .d4 { fill: #085041; }
      .d5 { fill: #9FE1CB; }
      @media (prefers-color-scheme: dark) {
        .logo-text { fill: #F1EFE8; }
        .logo-sub  { fill: #9FE1CB; }
      }
    </style>
  </defs>
  <!-- Icon -->
  <circle class="d1" cx="40" cy="40" r="10"/>
  <circle class="d2" cx="40" cy="20" r="6"/>
  <circle class="d3" cx="57" cy="30" r="6"/>
  <circle class="d3" cx="57" cy="50" r="6"/>
  <circle class="d4" cx="40" cy="60" r="6"/>
  <circle class="d5" cx="23" cy="50" r="6"/>
  <circle class="d2" cx="23" cy="30" r="6"/>
  <!-- Wordmark -->
  <text x="74" y="50"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="26" font-weight="500" letter-spacing="-0.5"
    class="logo-text">one<tspan class="logo-sub">place</tspan></text>
</svg>
